[project]
name = "mebreco"
version = "0.1.0"
description = "Polite MEB catalog crawler + content-based book recommendations"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "defusedxml>=0.7",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
browser = ["playwright>=1.40"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
mebreco = "mebreco.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mebreco = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
